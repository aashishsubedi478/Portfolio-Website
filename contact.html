<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Website</title>
    <link rel="stylesheet" href="/styles/style.css">
    <link rel="stylesheet" href="/styles/contact.css">
</head>

<body>
    <nav>
        <img src="images/logo.png" alt="logo" class="logo">
        <ul id="menu-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="service.html">Service</a></li>
            <li><a href="project.html">Project</a></li>
            <li><a href="aboutus.html">About us</a></li>
        </ul>
        <button class="nav-btn">Get Started <img src="images/white-arrow.png" alt="" class="get_started"></button>
        <img src="images/menu.png" alt="" class="menu-icon" onclick="toggleMenu()">
    </nav>
    <section class="get-in-touch">
        <h1 class="title">Get in touch</h1>
        <form class="contact-form row" id="contact_form">
            <div class="form-field col x-50"> <input id="name" class="input-text js-input" type="text" required> <label
                    class="label" for="name">Name</label> </div>
            <div class="form-field col x-50"> <input id="email" class="input-text js-input" type="email" required>
                <label class="label" for="email">E-mail</label> </div>
            <div class="form-field col x-100"> <input id="message" class="input-text js-input" type="text" required>
                <label class="label" for="message">Message</label> </div>
            <div class="form-field col x-100 align-center"> <input class="submit-btn" type="submit" value="Submit">
            </div>
        </form>
        <p id="message"></p>
    </section>
    <p class="note">Copyright&copy2025</p>
    <script src="/js/contact.js"></script>

</body>

</html>
